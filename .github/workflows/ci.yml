name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: lint (문법·오염·버전 정합·예제 정합·문서 드리프트)
        run: node tests/lint.js
      - name: playwright 설치
        run: |
          npm init -y > /dev/null
          npm i playwright > /dev/null
          npx playwright install --with-deps chromium
      - name: e2e 회귀 (브라우저)
        run: node tests/e2e.js
      - name: smoke (예제 전수 클릭 — JS 에러 0)
        run: node tests/smoke.js
      - name: 릴리스 게이트 (문서가 가리키는 태그가 실재하는가 — main 만)
        if: github.ref == 'refs/heads/main'
        run: node scripts/release.js --tag-gate
