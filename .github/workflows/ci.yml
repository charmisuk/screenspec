name: ci

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: lint (문법·오염·버전 정합·예제 정합·문서 드리프트·죽은 돌연변이)
        run: node tests/lint.js
      - name: playwright 설치
        run: |
          npm init -y > /dev/null
          npm i playwright > /dev/null
          npx playwright install --with-deps chromium
      # --grid 를 늘 켠다 (#112) — 선택 실행으로 두면 다섯 판 동안 빨간 채 아무도 모른다 (#91)
      - name: e2e 회귀 (브라우저) + 위계 전수
        run: node tests/e2e.js --grid
      - name: smoke (예제 전수 클릭 — JS 에러 0)
        run: node tests/smoke.js
      - name: 릴리스 게이트 (문서가 가리키는 태그가 실재하는가 — main 만)
        if: github.ref == 'refs/heads/main'
        run: node scripts/release.js --tag-gate

  # 돌연변이 (#112) — «사람이 기억해서 손으로 돌리는» 자리에 있던 것을 여기로.
  # 그 자리에 있는 동안 두 번 놓쳤다: #91 (grid 다섯 판), 2026-09-17 (죽은 돌연변이 둘이 v0.32 로 나갔다).
  # 세 대에 나눠 e2e 잡과 나란히 돈다 — 벽시계는 max(e2e, 한 샤드) 다
  mutation:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: playwright 설치
        run: |
          npm init -y > /dev/null
          npm i playwright > /dev/null
          npx playwright install --with-deps chromium
      - name: 돌연변이 ${{ matrix.shard }}/3 — 심은 결함을 e2e 가 잡는가
        env:
          SS_JOBS: "4"
        run: node scripts/mutate.js --shard=${{ matrix.shard }}/3
