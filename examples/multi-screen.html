<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SpecLayer 예제 — 다중 화면 (목록 → 상세)</title>
<style>
  body{color:#191919;line-height:1.6}
  button{font:inherit;cursor:pointer;border:0;background:none;color:inherit}
  .topbar{display:flex;align-items:center;gap:8px;padding:4px 0 16px}
  .topbar h1{font-size:18px;font-weight:800;margin:0}
  .back{font-size:13px;font-weight:700;color:#50524E;padding:6px 10px;border:1px solid #E9E9E7;border-radius:8px}
  .card-list{display:flex;flex-direction:column;gap:10px}
  .card{display:flex;align-items:center;gap:12px;border:1px solid #E9E9E7;border-radius:12px;padding:14px;text-align:left;width:100%}
  .card:hover{background:#FAFAF9}
  .card .thumb{width:44px;height:44px;border-radius:10px;display:grid;place-items:center;font-size:22px;flex-shrink:0}
  .card .nm{font-size:14px;font-weight:800}
  .card .ds{font-size:12px;color:#9B9A97}
  .detail-hero{border-radius:14px;padding:36px 20px;text-align:center;font-size:52px;margin-bottom:14px}
  .detail h2{font-size:20px;font-weight:800;margin:0 0 6px}
  .detail p{font-size:13.5px;color:#50524E;margin:0 0 16px}
  .buy{display:block;width:100%;background:#191919;color:#fff;font-weight:800;font-size:14px;border-radius:11px;padding:13px;text-align:center}
  #sheetModal{position:fixed;inset:0;background:rgba(17,24,39,.4);display:none;align-items:flex-end;z-index:9510}
  #sheetModal.open{display:flex}
  #sheetModal .panel{background:#fff;border-radius:16px 16px 0 0;padding:20px;width:100%}
  #sheetModal h3{font-size:15px;font-weight:800;margin:0 0 8px}
  #sheetModal p{font-size:13px;color:#50524E;margin:0 0 14px}
  #sheetModal .ok{width:100%;background:#191919;color:#fff;font-weight:800;border-radius:10px;padding:12px}
</style>
</head>
<body>
  <!-- ============ 화면 1: 목록 ============ -->
  <div data-sl-screen="SCR-EX-LST-001">
    <div class="topbar" data-spec="1"><h1>과일 상점</h1></div>
    <div class="card-list" data-spec="2">
      <button class="card" onclick="go('detail')">
        <span class="thumb" style="background:#FFE8EE">🍑</span>
        <span><span class="nm">복숭아</span><br><span class="ds">4,500원 · 당도 13Brix</span></span>
      </button>
      <button class="card" onclick="go('detail')">
        <span class="thumb" style="background:#FFF9E3">🍌</span>
        <span><span class="nm">바나나</span><br><span class="ds">3,200원 · 송이당</span></span>
      </button>
      <button class="card" onclick="go('detail')">
        <span class="thumb" style="background:#EFFAEF">🍏</span>
        <span><span class="nm">청사과</span><br><span class="ds">5,800원 · 3입</span></span>
      </button>
    </div>
  </div>

  <!-- ============ 화면 2: 상세 ============ -->
  <div data-sl-screen="SCR-EX-DTL-002" style="display:none">
    <div class="topbar" data-spec="1">
      <button class="back" onclick="go('list')">← 목록</button><h1>상품 상세</h1>
    </div>
    <div class="detail">
      <div class="detail-hero" data-spec="2" style="background:#FFE8EE">🍑</div>
      <h2 data-spec="3">복숭아</h2>
      <p>당도 13Brix 이상 선별 · 산지 직송 · 4,500원</p>
      <button class="buy" data-spec="4" onclick="openSheet()">구매하기</button>
    </div>
  </div>

  <!-- 구매 바텀시트 (팝업 데모) -->
  <div id="sheetModal" data-sl-ignore onclick="if(event.target===this)closeSheet()">
    <div class="panel">
      <h3>구매 확인</h3>
      <p>복숭아 1박스 · 4,500원을 구매할까요?</p>
      <button class="ok" onclick="closeSheet()">확인</button>
    </div>
  </div>

  <script>
  function go(which){
    document.querySelector('[data-sl-screen="SCR-EX-LST-001"]').style.display = which==='list' ? '' : 'none';
    document.querySelector('[data-sl-screen="SCR-EX-DTL-002"]').style.display = which==='detail' ? '' : 'none';
  }
  function openSheet(){ document.getElementById('sheetModal').classList.add('open'); }
  function closeSheet(){ document.getElementById('sheetModal').classList.remove('open'); }
  </script>

  <script>
  window.SPECLAYER = {
    screens: [
      {
        id: "SCR-EX-LST-001", name: "상품 목록", path: ["홈", "과일 상점"],
        root: '[data-sl-screen="SCR-EX-LST-001"]',
        specs: [
          { n:1, target:"1", anno:"box", title:"타이틀 바", defs:[
            { t:"화면명 '과일 상점' 고정 표시" }]},
          { n:2, target:"2", anno:"flow", title:"상품 카드 목록", flowTo:"SCR-EX-DTL-002",
            play:{ selector:'[data-sl-screen="SCR-EX-LST-001"] .card', label:"이동 — 상품 상세" }, defs:[
            { t:"상품 카드 세로 나열 · 등록순 정렬" },
            { t:"카드 클릭 시 상품 상세로 이동", subs:[
              "이동 시 화면정의서 헤더·기능정의도 상세 화면으로 자동 전환"]}]}
        ]
      },
      {
        id: "SCR-EX-DTL-002", name: "상품 상세", path: ["홈", "과일 상점", "상품 상세"],
        root: '[data-sl-screen="SCR-EX-DTL-002"]',
        specs: [
          { n:1, target:"1", anno:"flow", title:"뒤로가기", flowTo:"SCR-EX-LST-001",
            play:{ selector:'[data-sl-screen="SCR-EX-DTL-002"] .back', label:"이동 — 상품 목록" }, defs:[
            { t:"'← 목록' 클릭 시 상품 목록으로 복귀" }]},
          { n:2, target:"2", anno:"box", title:"상품 이미지", defs:[
            { t:"1:1 히어로 · 상품 대표 이미지 표시" }]},
          { n:3, target:"3", anno:"state", title:"상품 정보", defs:[
            { t:"상품명 + 당도·산지·가격 표시", subs:[
              "재고 0이면 가격 대신 '품절' 표시 + 구매 버튼 비활성"]}]},
          { n:4, target:"4", anno:"popup", title:"구매 버튼",
            play:{ selector:'[data-sl-screen="SCR-EX-DTL-002"] .buy', label:"팝업 열기 — 구매 확인" }, defs:[
            { t:"클릭 시 구매 확인 바텀시트 표시" },
            { t:"시트 바깥 클릭 시 닫힘" }]}
        ]
      }
    ]
  };
  </script>
  <script src="../speclayer.js"></script>
</body>
</html>
